kit: javascript
patterns:
  - name: Hardcoded Password in JS
    regex: '(?i)(?:var|let|const)\s+[a-zA-Z_$][a-zA-Z0-9_$]*[Pp]ass(?:word)?\s*=\s*["\x27][^\s"\x27]{6,}["\x27]'
    category: JavaScript Specific
    severity: high

  - name: Hardcoded API Key in JS
    regex: '(?i)(?:var|let|const)\s+[a-zA-Z_$][a-zA-Z0-9_$]*(?:[Aa]pi[Kk]ey|[Aa][Pp][Ii][_-]?[Kk][Ee][Yy]|[Aa][Cc][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn])\s*=\s*["\x27][a-zA-Z0-9_\-\.]{16,}["\x27]'
    category: JavaScript Specific
    severity: high

  - name: Hardcoded Secret in JS
    regex: '(?i)(?:var|let|const)\s+[a-zA-Z_$][a-zA-Z0-9_$]*[Ss]ecret\s*=\s*["\x27][a-zA-Z0-9_\-\.+/]{16,}["\x27]'
    category: JavaScript Specific
    severity: high

  - name: eval() with Dynamic Input
    regex: 'eval\s*\(\s*(?:location|document|window|this)\.'
    category: JavaScript Specific
    severity: high

  - name: document.write Usage
    regex: 'document\.write\s*\('
    category: JavaScript Specific
    severity: medium

  - name: innerHTML Assignment
    regex: '\.innerHTML\s*[+]?='
    category: JavaScript Specific
    severity: medium

  - name: localStorage Sensitive Data
    regex: 'localStorage\.setItem\s*\(\s*["\x27](?:token|password|secret|key|auth|session)["\x27]'
    category: JavaScript Specific
    severity: high

  - name: sessionStorage Sensitive Data
    regex: 'sessionStorage\.setItem\s*\(\s*["\x27](?:token|password|secret|key|auth|session)["\x27]'
    category: JavaScript Specific
    severity: high

  - name: Source Map Reference
    regex: '//# sourceMappingURL=.+\.map'
    category: JavaScript Specific
    severity: low

  - name: console.log with Sensitive Variable
    regex: '(?i)console\.(?:log|debug|info|warn|error)\s*\([^)]*(?:password|secret|token|key|auth)[^)]*\)'
    category: JavaScript Specific
    severity: medium

  - name: Postmessage with No Origin Check
    regex: 'window\.addEventListener\s*\(\s*["\x27]message["\x27][^)]*\*["\x27]'
    category: JavaScript Specific
    severity: high

  - name: Hardcoded Internal URL
    regex: '(?:var|let|const|=)\s*["\x27]https?://(?:10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|localhost|127\.0\.0\.1)["\x27]'
    category: JavaScript Specific
    severity: medium

  - name: JSONP Callback Injection Risk
    regex: '(?i)[?&]callback=[a-zA-Z0-9_]+'
    category: JavaScript Specific
    severity: medium

  - name: Prototype Pollution Risk
    regex: '__proto__\s*\['
    category: JavaScript Specific
    severity: high

  - name: Angular Expression Injection
    regex: '\{\{.*(?:constructor|__proto__|prototype).*\}\}'
    category: JavaScript Specific
    severity: high
