kit: financial
patterns:
  - name: Visa Card Number
    regex: '\b4[0-9]{12}(?:[0-9]{3})?(?:[0-9]{3})?\b'
    category: Financial Data
    severity: high

  - name: Mastercard Number
    regex: '\b(?:5[1-5][0-9]{2}|222[1-9]|22[3-9][0-9]|2[3-6][0-9]{2}|27[01][0-9]|2720)[0-9]{12}\b'
    category: Financial Data
    severity: high

  - name: American Express Card Number
    regex: '3[47][0-9]{13}'
    category: Financial Data
    severity: high

  - name: Discover Card Number
    regex: '6(?:011|5[0-9]{2})[0-9]{12}'
    category: Financial Data
    severity: high

  - name: US Social Security Number
    regex: '(?:[0-9]{3}-[0-9]{2}-[0-9]{4})'
    category: Financial Data
    severity: high

  - name: IBAN
    regex: '[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}(?:[A-Z0-9]{0,16})'
    category: Financial Data
    severity: high

  - name: US Bank Routing Number
    regex: '\b(?:0[0-9]|1[0-2]|2[1-9]|3[0-2]|6[1-9]|7[0-2]|80)[0-9]{7}\b'
    category: Financial Data
    severity: medium

  - name: Bitcoin Address
    regex: '\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\b'
    category: Financial Data
    severity: medium

  - name: Ethereum Address
    regex: '0x[a-fA-F0-9]{40}'
    category: Financial Data
    severity: medium

  - name: Price with Currency Symbol
    regex: '(?:USD|EUR|GBP|JPY|\$|€|£)\s*[0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?'
    category: Financial Data
    severity: low

  - name: Tax ID / EIN
    regex: '[0-9]{2}-[0-9]{7}'
    category: Financial Data
    severity: high

  - name: SWIFT/BIC Code
    regex: '\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    category: Financial Data
    severity: medium
