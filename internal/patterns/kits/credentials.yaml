kit: credentials
patterns:
  - name: MySQL Connection String
    regex: 'mysql://[a-zA-Z0-9_\-]+:[^@\s]{1,100}@[a-zA-Z0-9_\-\.]+(?::[0-9]+)?/[a-zA-Z0-9_\-]+'
    category: Database & Infrastructure
    severity: high

  - name: PostgreSQL Connection String
    regex: 'postgres(?:ql)?://[a-zA-Z0-9_\-]+:[^@\s]{1,100}@[a-zA-Z0-9_\-\.]+(?::[0-9]+)?/[a-zA-Z0-9_\-]+'
    category: Database & Infrastructure
    severity: high

  - name: MongoDB Connection String
    regex: 'mongodb(?:\+srv)?://[a-zA-Z0-9_\-]+:[^@\s]{1,100}@[a-zA-Z0-9_\-\.\,]+(?::[0-9]+)?(?:/[a-zA-Z0-9_\-]+)?'
    category: Database & Infrastructure
    severity: high

  - name: Redis URL with Password
    regex: 'redis://:[^@\s]{1,100}@[a-zA-Z0-9_\-\.]+:[0-9]+'
    category: Database & Infrastructure
    severity: high

  - name: AMQP/RabbitMQ Connection String
    regex: 'amqps?://[a-zA-Z0-9_\-]+:[^@\s]{1,100}@[a-zA-Z0-9_\-\.]+(?::[0-9]+)?'
    category: Database & Infrastructure
    severity: high

  - name: RSA Private Key
    regex: '-----BEGIN RSA PRIVATE KEY-----'
    category: Database & Infrastructure
    severity: high

  - name: EC Private Key
    regex: '-----BEGIN EC PRIVATE KEY-----'
    category: Database & Infrastructure
    severity: high

  - name: OpenSSH Private Key
    regex: '-----BEGIN OPENSSH PRIVATE KEY-----'
    category: Database & Infrastructure
    severity: high

  - name: PGP Private Key Block
    regex: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    category: Database & Infrastructure
    severity: high

  - name: Generic Private Key
    regex: '-----BEGIN PRIVATE KEY-----'
    category: Database & Infrastructure
    severity: high

  - name: Password in Config Assignment
    regex: '(?i)password\s*[=:]\s*["\x27][^\s"\x27]{6,}["\x27]'
    category: Database & Infrastructure
    severity: high

  - name: DB Password Assignment
    regex: '(?i)db[_\-]?pass(?:word)?\s*[=:]\s*["\x27][^\s"\x27]{6,}["\x27]'
    category: Database & Infrastructure
    severity: high

  - name: Secret Key Assignment
    regex: '(?i)secret[_\-]?key\s*[=:]\s*["\x27][a-zA-Z0-9_\-]{16,}["\x27]'
    category: Database & Infrastructure
    severity: high

  - name: LDAP Bind Password
    regex: '(?i)(?:ldap|bind)[_\-]?(?:pass|password|pwd)\s*[=:]\s*["\x27][^\s"\x27]{6,}["\x27]'
    category: Database & Infrastructure
    severity: high

  - name: SSH DSA Private Key
    regex: '-----BEGIN DSA PRIVATE KEY-----'
    category: Database & Infrastructure
    severity: high

  - name: Hashicorp Vault Token
    regex: 's\.[a-zA-Z0-9]{24}'
    category: Database & Infrastructure
    severity: high

  - name: Basic Auth in URL
    regex: 'https?://[a-zA-Z0-9_\-]+:[^@\s/]{6,}@[a-zA-Z0-9_\-\.]+'
    category: Database & Infrastructure
    severity: high
