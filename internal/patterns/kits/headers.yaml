kit: headers
# NOTE: The following four patterns from the original Python draugr_main.py
# "Security Headers & Vulnerabilities" kit used negative lookaheads and cannot
# be ported to Go's RE2 engine, which does not support lookaheads or lookbehinds.
# They have been omitted:
#   - "Missing Strict-Transport-Security" (required (?!.*Strict-Transport-Security))
#   - "Missing X-Frame-Options" (required (?!.*X-Frame-Options))
#   - "Missing X-Content-Type-Options" (required (?!.*X-Content-Type-Options))
#   - "Missing Content-Security-Policy" (required (?!.*Content-Security-Policy))
patterns:
  - name: Server Version Disclosure
    regex: '(?i)Server:\s*(?:Apache|nginx|IIS|lighttpd|Jetty|Tomcat|Express|Caddy)[/\s][0-9]+\.[0-9]+'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: X-Powered-By Header
    regex: '(?i)X-Powered-By:\s*.+'
    category: Security Headers & Vulnerabilities
    severity: low

  - name: ASP.NET Version Disclosure
    regex: '(?i)X-AspNet-Version:\s*[0-9]+\.[0-9]+'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: PHP Version Disclosure
    regex: '(?i)X-PHP-Version:\s*[0-9]+\.[0-9]+'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: CORS Wildcard Origin
    regex: '(?i)Access-Control-Allow-Origin:\s*\*'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: CORS Allow Credentials with Wildcard
    regex: '(?i)Access-Control-Allow-Credentials:\s*true'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: Weak CSP Unsafe Inline
    regex: "(?i)Content-Security-Policy:[^\r\n]*'unsafe-inline'"
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: Weak CSP Unsafe Eval
    regex: "(?i)Content-Security-Policy:[^\r\n]*'unsafe-eval'"
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: CSP Wildcard Source
    regex: "(?i)Content-Security-Policy:[^\r\n]*(?:default-src|script-src)[^\r\n]*\\*"
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: Deprecated X-XSS-Protection Header
    regex: '(?i)X-XSS-Protection:\s*1'
    category: Security Headers & Vulnerabilities
    severity: low

  - name: Permissive X-Frame-Options
    regex: '(?i)X-Frame-Options:\s*ALLOWALL'
    category: Security Headers & Vulnerabilities
    severity: high

  - name: Cache-Control Missing No-Store
    regex: '(?i)Cache-Control:[^\r\n]*(?:public|no-cache)(?![^\r\n]*no-store)'
    category: Security Headers & Vulnerabilities
    severity: low

  - name: Set-Cookie Missing Secure Flag
    regex: '(?i)Set-Cookie:[^\r\n]*(?:session|token|auth|jwt)[^\r\n]*(?!\bSecure\b)'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: Set-Cookie Missing HttpOnly Flag
    regex: '(?i)Set-Cookie:[^\r\n]*(?:session|token|auth|jwt)[^\r\n]*(?!\bHttpOnly\b)'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: Exposed Stack Trace
    regex: '(?i)(?:at\s+[a-zA-Z0-9_$.<>]+\s*\([^)]*\.[a-z]+:[0-9]+:[0-9]+\))'
    category: Security Headers & Vulnerabilities
    severity: medium

  - name: Debug Mode Indicator
    regex: '(?i)(?:debug\s*=\s*true|APP_DEBUG\s*=\s*true|FLASK_DEBUG\s*=\s*1)'
    category: Security Headers & Vulnerabilities
    severity: high
